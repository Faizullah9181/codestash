[project]
name = "codestash-backend"
version = "0.1.0"
description = "FastAPI backend + Agentic AI Framework"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]
agentic = [
  "openai>=1.50.0",
  "google-genai>=0.8.0",
  "anthropic>=0.30.0",
  "chromadb>=0.5.0",
  "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
