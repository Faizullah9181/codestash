services:
  db:
    image: postgres:16
    container_name: codestash-db
    environment:
      POSTGRES_DB: codestash
      POSTGRES_USER: codestash
      POSTGRES_PASSWORD: codestash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: codestash-backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: codestash-frontend
    env_file:
      - ./frontend/.env
    environment:
      DEV_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
